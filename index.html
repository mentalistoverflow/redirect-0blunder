<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <!-- Theme/language init - external for CSP compliance -->
  <script src="/static/js/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="0blunder">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <title>0blunder</title>

  <!-- Favicon - chess knight -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9822;</text></svg>">

  <!-- Preconnect / DNS prefetch for external resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://lichess.org">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- DaisyUI 5 (CSS components) - MUST be before Tailwind so Tailwind can override -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <!-- DaisyUI component fallback (unlayered) - ensures components render even if CDN @layer fails -->
  <link rel="stylesheet" href="/static/css/daisyui-components.css?v=20260225i">

  <!-- Tailwind CSS 4 (browser CDN) - required by DaisyUI 5 for utility classes -->
  <script src="/static/vendor/tailwindcss-browser.min.js"></script>

  <!-- Stylesheets (order matters) -->
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="stylesheet" href="/static/css/tailwind-utilities.css?v=20260225i">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/style.css?v=20260306a">
  <link rel="stylesheet" href="/static/css/responsive.css?v=20260225i">
  <link rel="stylesheet" href="/static/vendor/chessground.base.css">
  <link rel="stylesheet" href="/static/vendor/chessground.brown.css">
  <link rel="stylesheet" href="/static/vendor/chessground.cburnett.css">
</head>
<body>

  <!-- Skip to content link for keyboard navigation (WCAG 2.1 AA) -->
  <a href="#app" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-primary focus:text-primary-content focus:px-4 focus:py-2 focus:rounded">
    Aller au contenu principal
  </a>

  <!--
    Layout is dynamically injected by app.js via layout.js.
    Auth page renders without sidebar (full-screen).
    Logged-in pages use DaisyUI drawer layout (sidebar + content).
  -->
  <div id="app" class="auth-container" role="main">
    <!-- Initial loading state - replaced by app.js -->
    <div class="spinner"></div>
  </div>

  <!-- Backend URL for WebSocket (dynamic - empty = same-origin, set for proxy deploy) -->
  <script src="/config/backend-url.js"></script>

  <!-- Vendor Scripts (Chart.js lazy-loaded by dashboard.js/review.js) -->
  <!-- Chess.js is ES module - load wrapper that exposes Chess globally -->
  <script type="module" src="/static/vendor/chess-global.js"></script>

  <!-- App Module -->
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
